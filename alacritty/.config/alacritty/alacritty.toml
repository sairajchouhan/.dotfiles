import = ["~/.config/alacritty/themes/tokyonight_night.toml"]
live_config_reload = true

[window]
decorations = "buttonless"

opacity = 1
blur = true

[font]
size = 18
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[env]
TERM = "xterm-256color"

[colors]
draw_bold_text_with_bright_colors = true
