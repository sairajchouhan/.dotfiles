"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
${custom.jj}\
$cmd_duration\
$line_break\
$python\
$character"""

[aws]
format = ''

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

# jj-starship replaces git_branch, git_state, git_status
[custom.jj]
when = "jj-starship detect"
shell = ["jj-starship", "--jj-symbol", "jj ", "--git-symbol", "git "]
format = "$output "

# Disable built-in git modules since jj-starship handles both
[git_branch]
disabled = true

[git_status]
disabled = true

[git_state]
disabled = true
