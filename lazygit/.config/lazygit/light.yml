# Ayu Light theme overrides — layered over config.yml via LG_CONFIG_FILE
# when macOS is in light mode (see fish function `lazygit`)
gui:
  theme:
    activeBorderColor:
      - "#FA8D3E"
      - "bold"
    inactiveBorderColor:
      - "#4CBF99"
    searchingActiveBorderColor:
      - "#FA8D3E"
      - "bold"
    optionsTextColor:
      - "#399EE6"
    selectedLineBgColor:
      - "#E7EAED"
    cherryPickedCommitFgColor:
      - "#A37ACC"
    cherryPickedCommitBgColor:
      - "#4CBF99"
    markedBaseCommitFgColor:
      - "#399EE6"
    markedBaseCommitBgColor:
      - "#F2AE49"
    unstagedChangesColor:
      - "#F07171"
    defaultFgColor:
      - "#5C6166"
